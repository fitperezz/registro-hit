<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Registro HIT">
<meta name="theme-color" content="#E9EBEE">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-180.png">
<title>Registro HIT — Estate 2026</title>
<style>
:root{
  --paper:#E9EBEE; --panel:#FFFFFF; --ink:#16202B; --mid:#5C6874; --faint:#98A2AE;
  --rule:#D3D8DE; --teal:#0F6B5F; --teal-bg:#E2F0ED; --amber:#A8501A; --amber-bg:#F8EBE1;
  --today:#1B3A5C;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 12px 80px}

header{position:sticky;top:0;z-index:40;background:var(--paper);padding:12px 0 6px;border-bottom:1px solid var(--rule);padding-top:calc(12px + env(safe-area-inset-top))}
h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
h1 small{display:block;font-weight:500;color:var(--faint);letter-spacing:.06em;font-size:10px;text-transform:none;margin-top:1px}
.ticker{display:flex;margin-top:9px;border:1px solid var(--rule);background:var(--panel);border-radius:7px;overflow:hidden}
.tk{flex:1;padding:6px 5px;border-right:1px solid var(--rule);min-width:0;text-align:center}
.tk:last-child{border-right:0}
.tk b{display:block;font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tk span{display:block;font-size:8px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-top:1px}
.up{color:var(--teal)} .down{color:var(--amber)}
nav.tabs{display:flex;gap:3px;margin-top:8px}
nav.tabs button{flex:1;padding:8px 2px;font:inherit;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:none;border:0;border-bottom:2px solid transparent;color:var(--faint);cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.striplbl{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 7px}
.striplbl h2{font-size:10px;letter-spacing:.11em;text-transform:uppercase;margin:0;color:var(--mid);font-weight:700}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.strip::-webkit-scrollbar{height:0}
.day{flex:0 0 58px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:6px 3px 5px;text-align:center;cursor:pointer}
.day .dow{font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.day .num{font-family:var(--mono);font-size:16px;font-weight:600;line-height:1.15}
.day .typ{font-size:10px;font-weight:800;color:var(--faint);margin-top:2px}
.day .ton{font-family:var(--mono);font-size:8px;color:var(--faint);min-height:11px}
.day.done{background:var(--teal-bg);border-color:#B9D8D1}
.day.done .typ,.day.done .ton{color:var(--teal)}
.day.pend{border-color:var(--today);border-width:2px;padding:5px 2px 4px}
.day.pend .dow{color:var(--today);font-weight:700}
.day.sel{background:var(--ink);border-color:var(--ink)}
.day.sel .dow,.day.sel .num,.day.sel .typ,.day.sel .ton{color:#fff}

.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;margin-bottom:11px;overflow:hidden}
.card>h3{margin:0;padding:10px 12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--rule);font-weight:700;color:var(--mid);display:flex;justify-content:space-between;gap:8px}
.card>h3 em{font-style:normal;font-family:var(--mono);color:var(--faint);letter-spacing:0;text-transform:none}

.sesshead{padding:12px}
.dateline{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dateline input{flex:1;height:36px;border:1px solid var(--rule);border-radius:7px;background:var(--panel);font-family:var(--mono);font-size:14px;padding:0 8px;color:var(--ink)}
.seg{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.seg button{width:38px;height:36px;border:0;border-right:1px solid var(--rule);background:var(--panel);font:inherit;font-size:13px;font-weight:800;color:var(--faint);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.stitle{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:0}
.ssub{font-size:12px;color:var(--mid);margin-top:1px}
.rot{font-size:11px;color:var(--faint);margin-top:6px;line-height:1.4}
.donebtn{margin-top:11px;width:100%;padding:13px;border-radius:8px;border:1px solid var(--ink);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.donebtn.on{background:var(--teal);border-color:var(--teal);color:#fff}

.ex{border-top:1px solid var(--rule);padding:11px 12px 13px}
.ex.js{background:#FBFCFC;box-shadow:inset 3px 0 0 var(--rule)}
.jslbl{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:5px}
.exname{font-weight:700;font-size:14px;letter-spacing:-.01em;line-height:1.3}
.exmeta{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:1px}
.flag{display:inline-block;font-size:8px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2px 5px;border-radius:3px;margin-left:5px;vertical-align:2px}
.flag.pr{background:var(--teal-bg);color:var(--teal)}
.flag.st{background:var(--amber-bg);color:var(--amber)}

.setblk{margin-top:10px;border-top:1px dashed var(--rule);padding-top:8px}
.setline{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.sn{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mid)}
.setline .sp{flex:1}
.rirw{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:4px}
.rirsel{height:28px;border:1px solid var(--rule);border-radius:5px;background:var(--panel);font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink);padding:0 2px}
.tt{font-family:var(--mono);font-size:11px;color:var(--mid);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.units{display:flex;gap:8px;align-items:center;margin:0 0 3px}
.units .sl{width:24px}
.units .u{width:114px;text-align:center;font-size:8px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:700}
.side{display:flex;gap:8px;align-items:center;margin-bottom:5px}
.sl{width:24px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--faint)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:var(--panel);width:114px}
.stepper button{width:34px;height:38px;border:0;background:#F3F5F7;color:var(--mid);font-size:18px;font-weight:600;line-height:1;font-family:var(--mono);cursor:pointer;flex:0 0 34px}
.stepper button:active{background:var(--ink);color:#fff}
.stepper input{width:46px;height:38px;border:0;text-align:center;font-family:var(--mono);font-size:15px;font-weight:600;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums;padding:0;min-width:0}
.stepper input:focus{outline:2px solid var(--today);outline-offset:-2px}
.last{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:8px}
.note{font-size:11px;color:var(--mid);margin-top:6px;line-height:1.4}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.fld label{display:block;font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:3px}
.fld input,.fld select{width:100%;height:38px;border:1px solid var(--rule);border-radius:7px;background:var(--panel);font-family:var(--mono);font-size:15px;font-weight:600;color:var(--ink);padding:0 8px}
.btn{width:100%;padding:12px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:inherit;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn.warn{background:var(--panel);color:var(--amber);border-color:var(--amber)}
.btnrow{display:flex;gap:8px;padding:0 12px 12px}
table.hist{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
table.hist th{font-family:var(--sans);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:right;padding:7px 6px;border-bottom:1px solid var(--rule);font-weight:700}
table.hist th:first-child{text-align:left}
table.hist td{padding:6px;text-align:right;border-bottom:1px solid #EDF0F2}
table.hist td:first-child{text-align:left;color:var(--mid)}
.del{color:var(--faint);cursor:pointer;font-size:15px}
svg.chart{display:block;width:100%;height:auto}
.empty{padding:20px 14px;text-align:center;color:var(--faint);font-size:13px;line-height:1.5}
.hint{font-size:11px;color:var(--faint);line-height:1.5;padding:0 12px 12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(90px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;font-weight:600;z-index:99;transition:transform .25s;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Registro HIT<small>Estate 2026 · rotazione A / B / C</small></h1>
  <div class="ticker" id="ticker"></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="sedute" aria-selected="true">Sedute</button>
    <button role="tab" data-tab="corpo" aria-selected="false">Corpo</button>
    <button role="tab" data-tab="trend" aria-selected="false">Trend</button>
    <button role="tab" data-tab="dati" aria-selected="false">Dati</button>
  </nav>
</header>
<main>
  <section id="tab-sedute">
    <div class="striplbl"><h2>Storico sedute</h2></div>
    <div class="strip" id="strip"></div>
    <div id="session"></div>
  </section>
  <section id="tab-corpo" hidden></section>
  <section id="tab-trend" hidden></section>
  <section id="tab-dati" hidden></section>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const KEY="registro-hit-2026";
const STEP=1;            // incremento carico, uguale per tutti: 1 kg

const PLAN={
A:{title:"Sessione A",sub:"Gambe + spinta/trazione verticale",ex:[
 {id:"bss",n:"Bulgarian Split Squat (DB)",uni:1,reps:"8-12",load:16,js:null,
  note:"Allungamento profondo su quadricipite, adduttori e gluteo. Il moment arm all'anca è massimo nel punto di massimo stiramento."},
 {id:"idp",n:"Incline DB Press 1-braccio",uni:1,reps:"6-10",load:24,js:"Jump set 1",
  note:"Panca 30-45°. Nelle prime sedute cede il core in antirotazione, non il petto."},
 {id:"lpd",n:"Lat Pulldown 1-braccio",uni:1,reps:"8-12",load:35,js:"Jump set 1",
  note:"In ginocchio sotto la colonna, presa neutra. Lascia salire la scapola per allungare del tutto il dorsale."},
 {id:"clr",n:"Cable Lateral Raise 1-braccio",uni:1,reps:"10-15",load:5,js:"Jump set 2",
  note:"Leaning: busto inclinato, mano libera al rack. Carica il deltoide a braccio basso, dove in piedi il momento è nullo."},
 {id:"crd",n:"Cable Rear Delt Fly 1-braccio",uni:1,reps:"12-15",load:5,js:"Jump set 2",
  note:"Cavo alto, braccio che attraversa il corpo in partenza: massimo allungamento del deltoide posteriore."}]},
B:{title:"Sessione B",sub:"Spinta/trazione orizzontale + braccia",ex:[
 {id:"fdp",n:"Flat DB Press 1-braccio",uni:1,reps:"6-10",load:26,js:"Jump set 1",
  note:"Parti dal sinistro: detta lui le ripetizioni. Non tagliare il destro di più di 1-2 rip per pareggiare."},
 {id:"row",n:"Cable Row 1-braccio",uni:1,reps:"8-12",load:35,js:"Jump set 1",
  note:"Lascia protrarre la scapola a fine eccentrica. È lì che sta lo stimolo, non nella strizzata finale."},
 {id:"ode",n:"Overhead DB Extension 1-braccio",uni:1,reps:"8-12",load:9,js:"Jump set 2",
  note:"Spalla flessa sopra la testa: unica posizione in cui il capo lungo del tricipite lavora in allungamento."},
 {id:"idc",n:"Incline DB Curl 1-braccio",uni:1,reps:"8-12",load:16,js:"Jump set 2",
  note:"Panca 45-60°, braccio che pende dietro la linea del corpo. Capo lungo del bicipite in allungamento."},
 {id:"dlr",n:"DB Lateral Raise 1-braccio",uni:1,reps:"12-15",load:8,js:null,
  note:"Leaning, agganciato al rack con la mano libera. Senza inclinazione del busto non c'è tensione in allungamento."}]},
C:{title:"Sessione C",sub:"Richiamo + braccia stretch focus",ex:[
 {id:"pul",n:"DB Pullover",uni:0,reps:"8-12",load:20,js:"Jump set 1",
  note:"Unico bilaterale della scheda: è dorso, fuori dal vincolo unilaterale. Massimo allungamento del gran dorsale in home gym."},
 {id:"idp",n:"Incline DB Press 1-braccio",uni:1,reps:"6-10",load:24,js:"Jump set 1",
  note:"Seconda esposizione settimanale del petto. Stesso carico della Sessione A."},
 {id:"oce",n:"Overhead Cable Extension 1-braccio",uni:1,reps:"8-12",load:9,js:"Jump set 2",
  note:"Ai cavi la tensione resta anche nel punto di massimo allungamento, dove il manubrio la perde."},
 {id:"bay",n:"Bayesian Curl 1-braccio",uni:1,reps:"8-12",load:10,js:"Jump set 2",
  note:"Cavo basso dietro le spalle. Unico curl che carica il capo lungo con la spalla in estensione."},
 {id:"clr",n:"Cable Lateral Raise 1-braccio",uni:1,reps:"10-15",load:5,js:"Jump set 3",
  note:"Seconda esposizione settimanale del deltoide laterale."},
 {id:"cfp",n:"Cable Face Pull 1-braccio",uni:1,reps:"12-15",load:7.5,js:"Jump set 3",
  note:"Cavo all'altezza del viso, rotazione esterna a fine concentrica."}]}};

const SEED=[
 {d:"2026-04-20",peso:81.10,gr:23.8,mm:58.70,ms:null,visc:7,bmr:1704,note:""},
 {d:"2026-04-28",peso:79.45,gr:23.1,mm:58.10,ms:null,visc:6,bmr:1690,note:"Settimana di malattia"},
 {d:"2026-05-04",peso:80.90,gr:23.8,mm:58.60,ms:null,visc:7,bmr:1702,note:"Rientro con deload"},
 {d:"2026-05-11",peso:79.75,gr:23.2,mm:58.20,ms:39.56,visc:7,bmr:1692,note:"Muscolo scheletrico, campo diverso"},
 {d:"2026-05-22",peso:79.30,gr:23.0,mm:58.00,ms:null,visc:6,bmr:1688,note:"Precedente minimo"},
 {d:"2026-05-28",peso:79.50,gr:23.1,mm:58.10,ms:null,visc:6,bmr:1690,note:""},
 {d:"2026-06-15",peso:81.25,gr:23.9,mm:58.70,ms:null,visc:7,bmr:1705,note:"Picco del periodo"},
 {d:"2026-06-18",peso:80.50,gr:23.6,mm:58.40,ms:null,visc:7,bmr:1698,note:""},
 {d:"2026-08-11",peso:78.30,gr:22.6,mm:57.60,ms:39.15,visc:6,bmr:1679,note:"Minimo storico"}];

function blank(){ return {cfg:{first:"A"}, log:{}, body:SEED.slice()}; }
let S=(function(){ try{const r=localStorage.getItem(KEY); return r?Object.assign(blank(),JSON.parse(r)):blank(); }catch(e){ return blank(); } })();
let warned=false;
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ if(!warned){warned=true;toast("Salvataggio non disponibile con questo metodo di apertura");} } }

const DOW=["Dom","Lun","Mar","Mer","Gio","Ven","Sab"], MON=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parse(s){const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}
function today(){return iso(new Date());}
function fmt(s){const d=parse(s);return d.getDate()+" "+MON[d.getMonth()];}
function num(v){const n=parseFloat(v);return isFinite(n)?n:0;}
const CYC=["A","B","C"];

/* --- ROTAZIONE DINAMICA: avanza solo quando chiudi una seduta --- */
function doneDates(){ return Object.keys(S.log).filter(d=>S.log[d].done).sort(); }
function nextType(before){
  const dd=doneDates().filter(d=>!before||d<before);
  if(!dd.length) return S.cfg.first;
  const last=S.log[dd[dd.length-1]].type;
  return CYC[(CYC.indexOf(last)+1)%3];
}

function exTon(sets){let t=0;sets.forEach(s=>{t+=num(s.a)*num(s.ar)+num(s.b)*num(s.br);});return t;}
function sesTon(d){const s=S.log[d];if(!s)return 0;let t=0;for(const k in s.ex)t+=exTon(s.ex[k]);return t;}
function exHist(id,before){
  const out=[];
  doneDates().forEach(d=>{ if(before&&d>=before)return;
    const s=S.log[d]; if(!s.ex[id])return; const t=exTon(s.ex[id]); if(t>0)out.push({d:d,t:t,sets:s.ex[id]}); });
  return out.reverse();
}
function mkSets(ex,prev){
  if(prev) return JSON.parse(JSON.stringify(prev));
  const lo=parseInt(ex.reps.split("-")[0],10);
  return [{a:ex.load,ar:lo,b:ex.uni?ex.load:"",br:ex.uni?lo:"",rir:1},
          {a:ex.load,ar:lo,b:ex.uni?ex.load:"",br:ex.uni?lo:"",rir:0}];
}
function build(type,date){
  const o={};
  PLAN[type].ex.forEach(ex=>{ const h=exHist(ex.id,date); o[ex.id]=mkSets(ex,h.length?h[0].sets:null); });
  return o;
}
function ensure(date){
  if(!S.log[date]){ const t=nextType(date); S.log[date]={type:t,done:false,ex:build(t,date),note:""}; }
  return S.log[date];
}
function weekKey(s){const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);}
function weekStats(w){let ton=0,sed=0;doneDates().forEach(d=>{if(weekKey(d)!==w)return;const t=sesTon(d);if(t>0){ton+=t;sed++;}});return{ton:ton,sed:sed};}

let SEL=today();

/* ---------- TICKER ---------- */
function renderTicker(){
  const b=S.body.slice().sort((x,y)=>x.d<y.d?-1:1), l=b[b.length-1], p=b[b.length-2];
  const dp=(l&&p)?l.peso-p.peso:null, w=weekStats(weekKey(today()));
  document.getElementById("ticker").innerHTML=
    tk(l?l.peso.toFixed(2):"—","peso kg")+
    tk(dp===null?"—":(dp>0?"+":"")+dp.toFixed(2),"Δ ultima",dp===null?"":(dp<0?"up":"down"))+
    tk(l?l.gr.toFixed(1)+"%":"—","grasso")+
    tk(w.ton?(Math.round(w.ton/100)/10)+"t":"0","volume sett.")+
    tk(String(w.sed),"sedute sett.");
}
function tk(v,l,c){return '<div class="tk"><b class="'+(c||"")+'">'+v+'</b><span>'+l+'</span></div>';}

/* ---------- STRIP: storico reale + seduta in corso ---------- */
function renderStrip(){
  const dd=doneDates().slice(-14);
  const pend=[];
  Object.keys(S.log).forEach(d=>{ if(!S.log[d].done) pend.push(d); });
  if(pend.indexOf(today())<0 && dd.indexOf(today())<0) pend.push(today());
  const all=dd.concat(pend.filter(d=>dd.indexOf(d)<0)).sort();
  const el=document.getElementById("strip");
  el.innerHTML=all.map(dt=>{
    const s=S.log[dt], type=s?s.type:nextType(dt), ton=s&&s.done?sesTon(dt):0;
    const c=["day"]; if(s&&s.done&&ton>0)c.push("done"); else c.push("pend");
    if(dt===SEL)c.push("sel");
    const d=parse(dt);
    return '<div class="'+c.join(" ")+'" data-d="'+dt+'"><div class="dow">'+DOW[d.getDay()]+'</div>'+
      '<div class="num">'+d.getDate()+'</div><div class="typ">'+type+'</div>'+
      '<div class="ton">'+(ton?(Math.round(ton/100)/10)+"k":"")+'</div></div>';
  }).join("")||'<div class="empty" style="flex:1">Nessuna seduta.</div>';
  el.querySelectorAll(".day").forEach(n=>n.addEventListener("click",()=>{SEL=n.dataset.d;renderStrip();renderSession();}));
  const s=el.querySelector(".day.sel"); if(s) el.scrollLeft=s.offsetLeft-el.clientWidth/2+s.clientWidth/2;
}

/* ---------- SEDUTA ---------- */
function renderSession(){
  const s=ensure(SEL), plan=PLAN[s.type], d=parse(SEL);
  const dd=doneDates(), prev=dd.filter(x=>x<SEL).pop();
  let h='<div class="card"><div class="sesshead">';
  h+='<div class="dateline"><input type="date" id="sdate" value="'+SEL+'">'+
     '<div class="seg">'+CYC.map(t=>'<button data-t="'+t+'" class="'+(t===s.type?"on":"")+'">'+t+'</button>').join("")+'</div></div>';
  h+='<p class="stitle">'+plan.title+'</p><div class="ssub">'+DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+' · '+plan.sub+'</div>';
  h+='<div class="rot">'+(s.done
      ? 'Chiusa. La prossima sarà la <b>'+CYC[(CYC.indexOf(s.type)+1)%3]+'</b>, il giorno che ti alleni.'
      : (prev? 'Ultima chiusa: '+S.log[prev].type+' del '+fmt(prev)+'. Tocca la '+s.type+'.'
             : 'Prima seduta della rotazione.'))+'</div>';
  h+='<button class="donebtn'+(s.done?" on":"")+'" id="mkdone">'+(s.done?"Seduta chiusa ✓":"Chiudi seduta")+'</button></div>';

  plan.ex.forEach((ex,i)=>{
    const sets=s.ex[ex.id]||(s.ex[ex.id]=mkSets(ex,null));
    const hist=exHist(ex.id,SEL), cur=exTon(sets);
    const best=hist.length?Math.max.apply(null,hist.map(x=>x.t)):0;
    let flag="";
    if(s.done&&cur>0&&best>0&&cur>best) flag=' <span class="flag pr">Record</span>';
    else if(hist.length>=3&&hist[0].t<=hist[1].t&&hist[1].t<=hist[2].t) flag=' <span class="flag st">Stallo</span>';
    const showJs=ex.js&&(i===0||plan.ex[i-1].js!==ex.js);
    h+='<div class="ex'+(ex.js?" js":"")+'">';
    if(showJs)h+='<div class="jslbl">'+ex.js+'</div>';
    h+='<div class="exname">'+ex.n+flag+'</div><div class="exmeta">'+ex.reps+' rip · '+(ex.uni?"per lato":"bilaterale")+'</div>';
    sets.forEach((st,k)=>{
      h+='<div class="setblk"><div class="setline"><span class="sn">Serie '+(k+1)+'</span><span class="sp"></span>'+
         '<span class="rirw">RIR <select class="rirsel" data-e="'+ex.id+'" data-k="'+k+'" data-f="rir">'+
         [0,1,2,3].map(v=>'<option value="'+v+'"'+(Number(st.rir)===v?" selected":"")+'>'+v+'</option>').join("")+
         '</select></span><span class="tt">'+Math.round(num(st.a)*num(st.ar)+num(st.b)*num(st.br))+' kg</span></div>';
      h+='<div class="units"><span class="sl"></span><span class="u">kg</span><span class="u">rip</span></div>';
      h+='<div class="side"><span class="sl">'+(ex.uni?"Sx":"—")+'</span>'+stp(ex.id,k,"a",st.a,STEP)+stp(ex.id,k,"ar",st.ar,1)+'</div>';
      if(ex.uni) h+='<div class="side"><span class="sl">Dx</span>'+stp(ex.id,k,"b",st.b,STEP)+stp(ex.id,k,"br",st.br,1)+'</div>';
      h+='</div>';
    });
    if(hist.length){
      const p=hist[0], dl=cur-p.t;
      h+='<div class="last">Ultima ('+fmt(p.d)+'): '+Math.round(p.t)+' kg'+(cur>0?' · oggi '+Math.round(cur)+' kg ('+(dl>=0?"+":"")+Math.round(dl)+')':'')+'</div>';
    }
    h+='<div class="note">'+ex.note+'</div></div>';
  });
  h+='</div>';
  h+='<div class="card"><h3>Note seduta</h3><div style="padding:0 12px 12px">'+
     '<input id="snote" placeholder="caldo, sonno, dolori…" value="'+(s.note||"").replace(/"/g,"&quot;")+'" style="width:100%;height:38px;border:1px solid var(--rule);border-radius:7px;padding:0 9px;font:inherit;font-size:14px"></div></div>';
  document.getElementById("session").innerHTML=h;

  document.querySelectorAll("#session .stepper input").forEach(i=>i.addEventListener("input",e=>setF(e.target)));
  document.querySelectorAll("#session .stepper button").forEach(b=>b.addEventListener("click",e=>{
    const inp=e.target.parentNode.querySelector("input");
    let v=num(inp.value)+(e.target.dataset.dir==="+"?1:-1)*parseFloat(e.target.dataset.s);
    if(v<0)v=0; inp.value=Math.round(v*100)/100; setF(inp);
  }));
  document.querySelectorAll("#session .rirsel").forEach(x=>x.addEventListener("change",e=>setF(e.target)));
  document.getElementById("snote").addEventListener("input",e=>{S.log[SEL].note=e.target.value;save();});
  document.getElementById("sdate").addEventListener("change",e=>{
    const nd=e.target.value; if(!nd||nd===SEL)return;
    if(!S.log[nd]){ S.log[nd]=S.log[SEL]; delete S.log[SEL]; }
    SEL=nd; save(); renderStrip(); renderSession();
  });
  document.querySelectorAll("#session .seg button").forEach(b=>b.addEventListener("click",()=>{
    const t=b.dataset.t, cur=S.log[SEL];
    if(t===cur.type)return;
    if(cur.done||!confirm("Cambiare in Sessione "+t+"? I valori inseriti qui vengono sostituiti."))
      { if(cur.done){toast("Riapri la seduta per cambiarla");return;} return; }
    cur.type=t; cur.ex=build(t,SEL); save(); renderStrip(); renderSession();
  }));
  document.getElementById("mkdone").addEventListener("click",()=>{
    const c=S.log[SEL]; c.done=!c.done; save();
    toast(c.done?"Seduta chiusa · prossima: "+CYC[(CYC.indexOf(c.type)+1)%3]:"Seduta riaperta");
    renderStrip(); renderSession(); renderTicker();
  });
}
function stp(e,k,f,v,s){
  return '<span class="stepper"><button data-dir="-" data-s="'+s+'">−</button>'+
    '<input inputmode="decimal" data-e="'+e+'" data-k="'+k+'" data-f="'+f+'" value="'+(v===""?"":v)+'">'+
    '<button data-dir="+" data-s="'+s+'">+</button></span>';
}
function setF(el){
  const s=S.log[SEL], st=s.ex[el.dataset.e][el.dataset.k];
  st[el.dataset.f]=el.value; save();
  const blk=el.closest(".setblk"); if(blk){const t=blk.querySelector(".tt");
    if(t)t.textContent=Math.round(num(st.a)*num(st.ar)+num(st.b)*num(st.br))+" kg";}
  renderTicker();
}

/* ---------- CORPO ---------- */
function renderBody(){
  const b=S.body.slice().sort((x,y)=>x.d<y.d?-1:1).reverse();
  let h='<div class="card"><h3>Nuova pesata</h3><div class="grid2">'+
   fl("bd","Data","date",today())+fl("bp","Peso kg","number","")+fl("bg","Grasso %","number","")+
   fl("bm","Massa muscolare","number","")+fl("bs","Musc. scheletrico","number","")+fl("bv","Viscerale","number","")+
   fl("bb","BMR","number","")+fl("bn","Nota","text","")+'</div>'+
   '<div class="btnrow"><button class="btn" id="addbody">Salva pesata</button></div>'+
   '<div class="hint">Al mattino, a digiuno, prima di bere. Con il caldo vale la media di 2-3 pesate ravvicinate, mai la singola. Massa muscolare (~58 kg) e muscolo scheletrico (~39 kg) sono due campi RENPHO diversi.</div></div>';
  h+='<div class="card"><h3>Storico <em>'+b.length+'</em></h3><div style="overflow-x:auto"><table class="hist">'+
   '<tr><th>Data</th><th>Peso</th><th>Gr%</th><th>Grassa</th><th>Magra</th><th>Musc</th><th>Δ</th><th></th></tr>';
  b.forEach((r,i)=>{const nx=b[i+1],dl=nx?r.peso-nx.peso:null,mg=r.peso*r.gr/100;
    h+='<tr><td>'+fmt(r.d)+'</td><td>'+r.peso.toFixed(2)+'</td><td>'+r.gr.toFixed(1)+'</td><td>'+mg.toFixed(2)+
    '</td><td>'+(r.peso-mg).toFixed(2)+'</td><td>'+(r.mm?r.mm.toFixed(1):"—")+'</td><td class="'+(dl===null?"":(dl<0?"up":"down"))+'">'+
    (dl===null?"—":(dl>0?"+":"")+dl.toFixed(2))+'</td><td><span class="del" data-d="'+r.d+'">×</span></td></tr>';});
  h+='</table></div></div>';
  document.getElementById("tab-corpo").innerHTML=h;
  document.getElementById("addbody").addEventListener("click",addBody);
  document.querySelectorAll("#tab-corpo .del").forEach(x=>x.addEventListener("click",e=>{
    const d=e.target.dataset.d; if(!confirm("Eliminare la pesata del "+fmt(d)+"?"))return;
    S.body=S.body.filter(r=>r.d!==d);save();renderBody();renderTicker();renderTrend();}));
}
function fl(id,l,t,v){return '<div class="fld"><label>'+l+'</label><input id="'+id+'" type="'+t+'"'+(t==="number"?' inputmode="decimal" step="0.01"':'')+' value="'+v+'"></div>';}
function addBody(){
  const g=i=>document.getElementById(i).value;
  const d=g("bd"),p=parseFloat(g("bp")),gr=parseFloat(g("bg"));
  if(!d||!isFinite(p)||!isFinite(gr)){toast("Servono data, peso e grasso %");return;}
  S.body=S.body.filter(r=>r.d!==d);
  S.body.push({d:d,peso:p,gr:gr,mm:parseFloat(g("bm"))||null,ms:parseFloat(g("bs"))||null,visc:parseFloat(g("bv"))||null,bmr:parseFloat(g("bb"))||null,note:g("bn")});
  save();toast("Pesata salvata");renderBody();renderTicker();renderTrend();
}

/* ---------- TREND ---------- */
function line(ser,color,pad){
  const W=680,H=180,ml=42,mr=10,mt=12,mb=26;
  if(ser.length<2)return '<div class="empty">Servono almeno due rilevamenti.</div>';
  const vs=ser.map(s=>s.v);let mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  const p=pad||(mx-mn)*.25||1;mn-=p;mx+=p;
  const x=i=>ml+i*(W-ml-mr)/(ser.length-1), y=v=>mt+(1-(v-mn)/(mx-mn))*(H-mt-mb);
  let g="";
  for(let t=0;t<=3;t++){const v=mn+(mx-mn)*t/3,yy=y(v);
    g+='<line x1="'+ml+'" y1="'+yy+'" x2="'+(W-mr)+'" y2="'+yy+'" stroke="#E4E8EB"/>'+
       '<text x="'+(ml-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10" fill="#98A2AE" font-family="monospace">'+(Math.round(v*10)/10)+'</text>';}
  g+='<polyline points="'+ser.map((s,i)=>x(i)+","+y(s.v)).join(" ")+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round"/>';
  ser.forEach((s,i)=>{g+='<circle cx="'+x(i)+'" cy="'+y(s.v)+'" r="3.2" fill="#fff" stroke="'+color+'" stroke-width="2"/>';});
  const k=Math.ceil(ser.length/6);
  ser.forEach((s,i)=>{if(i%k===0||i===ser.length-1)g+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="#98A2AE">'+fmt(s.d)+'</text>';});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+g+'</svg>';
}
function bars(ser,color){
  const W=680,H=170,ml=42,mr=10,mt=12,mb=26;
  if(!ser.length)return '<div class="empty">Nessuna seduta chiusa.</div>';
  const mx=Math.max.apply(null,ser.map(s=>s.v))||1,bw=(W-ml-mr)/ser.length;let g="";
  for(let t=0;t<=3;t++){const yy=mt+(1-t/3)*(H-mt-mb);
    g+='<line x1="'+ml+'" y1="'+yy+'" x2="'+(W-mr)+'" y2="'+yy+'" stroke="#E4E8EB"/>'+
       '<text x="'+(ml-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10" fill="#98A2AE" font-family="monospace">'+(Math.round(mx*t/3/100)/10)+'t</text>';}
  ser.forEach((s,i)=>{const h=(s.v/mx)*(H-mt-mb);
    g+='<rect x="'+(ml+i*bw+bw*.18)+'" y="'+(H-mb-h)+'" width="'+(bw*.64)+'" height="'+h+'" fill="'+color+'" rx="2"/>'+
       '<text x="'+(ml+i*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="#98A2AE">'+fmt(s.d)+'</text>';});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+g+'</svg>';
}
function renderTrend(){
  const b=S.body.slice().sort((x,y)=>x.d<y.d?-1:1), wk={};
  doneDates().forEach(d=>{const t=sesTon(d);if(t>0){const w=weekKey(d);wk[w]=(wk[w]||0)+t;}});
  const ws=Object.keys(wk).sort().slice(-12).map(w=>({d:w,v:wk[w]}));
  let h='<div class="card"><h3>Peso <em>kg</em></h3>'+line(b.map(r=>({d:r.d,v:r.peso})),"#1B3A5C",.6)+'</div>';
  h+='<div class="card"><h3>Massa grassa vs magra <em>kg</em></h3>'+
     line(b.map(r=>({d:r.d,v:Math.round(r.peso*r.gr)/100})),"#A8501A",.5)+
     '<div style="border-top:1px solid var(--rule)">'+line(b.map(r=>({d:r.d,v:Math.round((r.peso-r.peso*r.gr/100)*100)/100})),"#0F6B5F",.5)+'</div>'+
     '<div class="hint">Sopra la massa grassa (ambra), sotto la magra (verde). Se scendono insieme e in proporzione simile, il deficit è troppo aggressivo o lo stimolo insufficiente.</div></div>';
  h+='<div class="card"><h3>Grasso corporeo <em>%</em></h3>'+line(b.map(r=>({d:r.d,v:r.gr})),"#A8501A",.4)+'</div>';
  h+='<div class="card"><h3>Volume settimanale <em>tonnellaggio</em></h3>'+bars(ws,"#1B3A5C")+
     '<div class="hint">Deve salire lentamente o restare piatto a parità di sedute. Un crollo con lo stesso numero di sedute segnala fatica accumulata.</div></div>';
  document.getElementById("tab-trend").innerHTML=h;
}

/* ---------- DATI ---------- */
function renderData(){
  const n=doneDates().length; let tot=0; doneDates().forEach(d=>tot+=sesTon(d));
  let h='<div class="card"><h3>Backup</h3><div class="hint" style="padding-top:11px">I dati stanno solo su questo dispositivo. Nessun server. Esporta ogni tanto: svuotando i dati del browser spariscono.</div>'+
   '<div class="btnrow"><button class="btn" id="exp">Esporta</button><button class="btn ghost" id="imp">Importa</button></div>'+
   '<input type="file" id="file" accept=".json" hidden></div>';
  h+='<div class="card"><h3>Rotazione</h3><div class="grid2">'+
   '<div class="fld"><label>Prima sessione</label><select id="cfirst">'+CYC.map(t=>'<option'+(S.cfg.first===t?" selected":"")+'>'+t+'</option>').join("")+'</select></div>'+
   '<div class="fld"><label>Prossima sarà</label><input value="'+nextType()+'" readonly></div></div>'+
   '<div class="btnrow"><button class="btn ghost" id="savecfg">Aggiorna</button></div>'+
   '<div class="hint">Non ci sono giorni fissi: la rotazione avanza di una lettera ogni volta che chiudi una seduta. Se salti giorni non succede nulla, riprendi da dove eri.</div></div>';
  h+='<div class="card"><h3>Totali</h3><div class="grid2" style="padding-bottom:4px">'+
   '<div><div style="font-family:var(--mono);font-size:23px;font-weight:600">'+n+'</div><div style="font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)">sedute chiuse</div></div>'+
   '<div><div style="font-family:var(--mono);font-size:23px;font-weight:600">'+(Math.round(tot/100)/10)+' t</div><div style="font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)">tonnellaggio</div></div></div>'+
   '<div class="btnrow"><button class="btn warn" id="reset">Cancella tutto</button></div></div>';
  document.getElementById("tab-dati").innerHTML=h;
  document.getElementById("exp").addEventListener("click",()=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));
    a.download="registro-hit-"+today()+".json";a.click();URL.revokeObjectURL(a.href);toast("Backup esportato");});
  document.getElementById("imp").addEventListener("click",()=>document.getElementById("file").click());
  document.getElementById("file").addEventListener("change",e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const p=JSON.parse(r.result);if(!p.log)throw 0;S=Object.assign(blank(),p);save();SEL=today();all();toast("Backup importato");}catch(x){toast("File non valido");}};
    r.readAsText(f);});
  document.getElementById("savecfg").addEventListener("click",()=>{
    S.cfg.first=document.getElementById("cfirst").value;save();renderStrip();renderSession();renderData();toast("Aggiornato");});
  document.getElementById("reset").addEventListener("click",()=>{
    if(!confirm("Cancella tutte le sedute e le pesate. Esporta prima un backup. Procedere?"))return;
    S=blank();save();SEL=today();all();toast("Dati cancellati");});
}

let TT;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(TT);TT=setTimeout(()=>t.classList.remove("on"),2600);}
function all(){renderTicker();renderStrip();renderSession();renderBody();renderTrend();renderData();}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-selected",x===b?"true":"false"));
  ["sedute","corpo","trend","dati"].forEach(t=>{document.getElementById("tab-"+t).hidden=(t!==b.dataset.tab);});
  window.scrollTo({top:0});}));
all();

if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
(function(){let ok=false;try{localStorage.setItem("__t","1");localStorage.removeItem("__t");ok=true;}catch(e){}
if(!ok){const b=document.createElement("div");
b.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:120;background:#A8501A;color:#fff;padding:12px 14px;font:600 13px/1.45 -apple-system,sans-serif;padding-bottom:calc(12px + env(safe-area-inset-bottom))";
b.textContent="Salvataggio non disponibile: i dati andranno persi alla chiusura. Apri l'app dal suo indirizzo https e installala dalla schermata Home.";
document.body.appendChild(b);}})();
</script>
